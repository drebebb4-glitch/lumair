name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test

  deploy-pages:
    runs-on: ubuntu-latest
    needs: analyze-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build web (Supabase dart-define)
        run: >
          flutter build web --release
          --base-href=/lumair/
          --dart-define=SUPABASE_URL=https://kmhhaljzkjyxhwivnwiz.supabase.co
          --dart-define=SUPABASE_ANON_KEY=sb_publishable_m51nBaB38xD3RMl0XSFZPw_JKVHRAjC

      - name: Deploy ke gh-pages
        run: |
          cd build/web
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy: $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
