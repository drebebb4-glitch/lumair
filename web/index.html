<!DOCTYPE html>
<html lang="id" style="background:#070B14">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LUMAIR — cek kualitas udara kotamu: AQI, PM2.5, prakiraan, dan cara melindungi diri.">
  <meta name="theme-color" content="#070B14">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LUMAIR">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LUMAIR — Kualitas Udara</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Boot splash — menyatu dengan background app (#070B14), tanpa flash putih. */
    html, body { margin: 0; padding: 0; background: #070B14; height: 100%; }
    #boot {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #070B14;
      opacity: 1; transition: opacity .28s ease;
    }
    #boot.hide { opacity: 0; pointer-events: none; }
    .boot-logo {
      width: 84px; height: 84px;
      border-radius: 26px;
      background: linear-gradient(135deg, #34D399, #0EA5E9);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 28px rgba(52, 211, 153, .25);
      animation: bootPulse 1.8s ease-in-out infinite;
    }
    @keyframes bootPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .boot-dots { display: flex; gap: 7px; margin-top: 26px; }
    .boot-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: #34D399; opacity: .35;
      animation: bootDot 1.4s ease-in-out infinite;
    }
    .boot-dots span:nth-child(2) { animation-delay: .18s; }
    .boot-dots span:nth-child(3) { animation-delay: .36s; }
    @keyframes bootDot {
      0%, 100% { opacity: .35; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Splash loading branded: hilang setelah frame pertama Flutter siap. -->
  <div id="boot" aria-hidden="true">
    <div class="boot-logo">
      <svg viewBox="0 0 24 24" width="44" height="44" fill="none"
           stroke="#ffffff" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M9.59 4.59A2 2 0 1 1 11 8H2"/>
        <path d="M12.59 19.41A2 2 0 1 0 14 16H2"/>
        <path d="M17.73 7.73A2.5 2.5 0 1 1 19.5 12H2"/>
      </svg>
    </div>
    <div class="boot-dots"><span></span><span></span><span></span></div>
  </div>

  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load({
      onEntrypointLoaded: async function (engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        // runApp() selesai tepat saat frame pertama Flutter sudah digambar —
        // splash HTML baru dilepas di sini supaya transisinya mulus.
        await appRunner.runApp();
        const boot = document.getElementById('boot');
        if (boot) {
          boot.classList.add('hide');
          setTimeout(function () { boot.remove(); }, 320);
        }
      },
    });
  </script>
</body>
</html>
