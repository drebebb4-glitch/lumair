name: lumair
description: LUMAIR — Clarity in Every Breath. Air quality local app (SDG 11.6).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.2
  geolocator: ^12.0.0
  geocoding: ^4.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  fl_chart: ^0.68.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  network_image_mock: ^2.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/dummy/
